name: ML Model Auto-Deployment Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  PYTHON_VERSION: '3.9'
  DOCKER_IMAGE: ml-model-api
  REGISTRY: ghcr.io

jobs:
  # Job 1: Code Quality and Testing
  test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        
    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
          
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Lint with flake8
      run: |
        flake8 src/ --max-line-length=100 --count --statistics
        
    - name: Format check with black
      run: |
        black --check src/
        
    - name: Type check with mypy
      run: |
        mypy src/ --ignore-missing-imports
        
    - name: Security scan with bandit
      run: |
        bandit -r src/ -f json -o security-report.json
        
    - name: Upload security report
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: security-report
        path: security-report.json
        
    - name: Run unit tests
      run: |
        pytest tests/ --junitxml=test-results.xml --cov=src --cov-report=xml --cov-report=html
        
    - name: Upload test results
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: test-results
        path: |
          test-results.xml
          htmlcov/
          coverage.xml

  # Job 2: Model Training and Validation
  model-pipeline:
    runs-on: ubuntu-latest
    needs: test
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Train model
      run: |
        python src/train_model.py
        
    - name: Validate model
      run: |
        python src/validate_model.py
        
    - name: Upload model artifacts
      uses: actions/upload-artifact@v3
      with:
        name: trained-model
        path: |
          models/
          *.log

  # Job 3: Integration Testing
  integration-test:
    runs-on: ubuntu-latest
    needs: model-pipeline
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        
    - name: Download model artifacts
      uses: actions/download-artifact@v3
      with:
        name: trained-model
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Start API server
      run: |
        python src/model_api.py &
        sleep 10
        
    - name: Run integration tests
      run: |
        pytest tests/test_integration.py --api-url=http://localhost:8000

  # Job 4: Build and Push Docker Image
  build-and-push:
    runs-on: ubuntu-latest
    needs: [test, model-pipeline, integration-test]
    if: github.event_name == 'push'
    
    permissions:
      contents: read
      packages: write
      
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      
    - name: Download model artifacts
      uses: actions/download-artifact@v3
      with:
        name: trained-model
        
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2
      
    - name: Log in to Container Registry
      uses: docker/login-action@v2
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
        
    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v4
      with:
        images: ${{ env.REGISTRY }}/${{ github.repository }}/${{ env.DOCKER_IMAGE }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=sha,prefix={{branch}}-
          type=raw,value=latest,enable={{is_default_branch}}
          
    - name: Build and push Docker image
      uses: docker/build-push-action@v4
      with:
        context: .
        file: docker/Dockerfile
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        
    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: ${{ env.REGISTRY }}/${{ github.repository }}/${{ env.DOCKER_IMAGE }}:${{ github.sha }}
        format: 'sarif'
        output: 'trivy-results.sarif'
        
    - name: Upload Trivy scan results
      uses: github/codeql-action/upload-sarif@v2
      if: always()
      with:
        sarif_file: 'trivy-results.sarif'

  # Job 5: Deploy to Staging
  deploy-staging:
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/develop'
    
    environment:
      name: staging
      url: https://staging-api.yourcompany.com
      
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      
    - name: Configure kubectl
      uses: azure/k8s-set-context@v3
      with:
        method: kubeconfig
        kubeconfig: ${{ secrets.KUBE_CONFIG }}
        
    - name: Deploy to staging
      run: |
        IMAGE_TAG=${{ github.sha }}
        kubectl set image deployment/ml-api-staging ml-api=${{ env.REGISTRY }}/${{ github.repository }}/${{ env.DOCKER_IMAGE }}:develop-${IMAGE_TAG} -n staging
        kubectl rollout status deployment/ml-api-staging -n staging --timeout=300s
        
    - name: Run staging tests
      run: |
        pip install pytest requests
        pytest tests/test_staging.py --staging-url=https://staging-api.yourcompany.com

  # Job 6: Deploy to Production
  deploy-production:
    runs-on: ubuntu-latest
    needs: [build-and-push, deploy-staging]
    if: github.ref == 'refs/heads/main'
    
    environment:
      name: production
      url: https://api.yourcompany.com
      
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      
    - name: Configure kubectl
      uses: azure/k8s-set-context@v3
      with:
        method: kubeconfig
        kubeconfig: ${{ secrets.KUBE_CONFIG }}
        
    - name: Deploy to production
      run: |
        IMAGE_TAG=${{ github.sha }}
        kubectl set image deployment/ml-api-prod ml-api=${{ env.REGISTRY }}/${{ github.repository }}/${{ env.DOCKER_IMAGE }}:main-${IMAGE_TAG} -n production
        kubectl rollout status deployment/ml-api-prod -n production --timeout=300s
        
    - name: Run production smoke tests
      run: |
        pip install pytest requests
        pytest tests/test_smoke.py --prod-url=https://api.yourcompany.com
        
    - name: Run performance tests
      run: |
        pip install locust
        locust -f tests/load_test.py --headless -u 10 -r 2 -t 60s --host=https://api.yourcompany.com

  # Job 7: Notify on Success/Failure
  notify:
    runs-on: ubuntu-latest
    needs: [deploy-production]
    if: always()
    
    steps:
    - name: Notify Slack on Success
      if: ${{ needs.deploy-production.result == 'success' }}
      uses: 8398a7/action-slack@v3
      with:
        status: success
        text: '🎉 ML Model deployed successfully to production!'
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        
    - name: Notify Slack on Failure
      if: ${{ needs.deploy-production.result == 'failure' }}
      uses: 8398a7/action-slack@v3
      with:
        status: failure
        text: '❌ ML Model deployment failed!'
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
